<div id="settingsPage">
    <table id="settingsTable" class="table table-striped">
        <thead>
            <tr class="table-active">
                <th>Username</th>
                <th>Admin</th>
                <th>Enable/Disable</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="settingsRows">
            <tr *ngFor="let user of users">
                <td>{{ user.userName }}</td>
                <td>{{ user.admin ? 'Yes' : 'No' }}</td>
                <td>{{ user.disabled? 'Disabled' : 'Enabled' }}<td>
            </tr>
        </tbody>
    </table>
</div>

<form id="loginPage" (ngSubmit)="login()" *ngIf="userService.user$ | async as user">
    <h3>Login</h3>                      
    <input [(ngModel)]="userName" name="userName" class="form-control mb-2">
    <input [(ngModel)]="password" name="password" type="password" class="form-control mb-2">
    <button type="submit" class="btn btn-primary btn-sm">Login</button>
</form>
